name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        name: Backend (PHPUnit incl. integration, PHPStan, Pint)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: syifa
                    POSTGRES_PASSWORD: syifa_ci_password
                    POSTGRES_DB: syifa
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U syifa"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7
                ports: ['6379:6379']
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            REDIS_HOST: 127.0.0.1
            REDIS_PORT: 6379
            # Integration suites create and remove their own module tables. Keep
            # each suite in a dedicated disposable database so those operations
            # cannot collide with another module's schema or foreign keys.
            BOOKING_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_booking_test
            CLINIC_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_clinic_test
            CLINIC_REGISTRATION_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_clinic_registration_test
            COMMERCIAL_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_commercial_test
            ONBOARDING_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_onboarding_test
            PLATFORM_ADMINISTRATION_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_platform_administration_test
            PUBLIC_BOOKING_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_public_booking_test
            RELEASE_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_release_test
            SUBSCRIPTION_BILLING_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_subscription_billing_test
            TENANT_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_tenant_test
            WEBSITE_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_website_test

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: pgsql, redis, mbstring, bcmath
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi

            - name: Create isolated integration databases
              env:
                  PGPASSWORD: syifa_ci_password
              run: |
                  for database in \
                      syifa_booking_test \
                      syifa_clinic_test \
                      syifa_clinic_registration_test \
                      syifa_commercial_test \
                      syifa_onboarding_test \
                      syifa_platform_administration_test \
                      syifa_public_booking_test \
                      syifa_release_test \
                      syifa_subscription_billing_test \
                      syifa_tenant_test \
                      syifa_website_test
                  do
                      createdb --host=127.0.0.1 --port=5432 --username=syifa "$database"
                  done

            - name: Run migrations against the CI database
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: syifa
                  DB_USERNAME: syifa
                  DB_PASSWORD: syifa_ci_password
              run: php artisan migrate --force

            - name: Pint (formatting)
              run: vendor/bin/pint --test

            - name: PHPStan / Larastan (level 8)
              run: composer analyse

            - name: PHPUnit (Unit, Feature, Integration, Contract, Architecture)
              shell: bash
              run: |
                  set +e
                  vendor/bin/phpunit 2>&1 | tee /tmp/phpunit-output.log
                  phpunit_status=${PIPESTATUS[0]}
                  set -e

                  if [ "$phpunit_status" -ne 0 ]; then
                      failure_details=$(tail -n 100 /tmp/phpunit-output.log)
                      failure_details=${failure_details//'%'/'%25'}
                      failure_details=${failure_details//$'\r'/'%0D'}
                      failure_details=${failure_details//$'\n'/'%0A'}
                      echo "::error title=PHPUnit failure details::$failure_details"
                  fi

                  exit "$phpunit_status"

    frontend:
        name: Frontend (ESLint, Prettier, build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: ESLint
              run: npx eslint resources/js --ext .vue,.js

            - name: Prettier (check only)
              run: npx prettier --check .

            - name: Vite build
              run: npx vite build --mode production
