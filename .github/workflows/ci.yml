name: CI

# Production is a stage of this pipeline, not an independent push workflow.
# A failed backend or frontend check must make deployment unreachable.

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    backend:
        name: Backend (PHPUnit incl. integration, PHPStan, Pint)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: syifa
                    POSTGRES_PASSWORD: syifa_ci_password
                    POSTGRES_DB: syifa
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U syifa"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7
                ports: ['6379:6379']
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            REDIS_HOST: 127.0.0.1
            REDIS_PORT: 6379
            # Integration suites create and remove their own module tables. Keep
            # each suite in a dedicated disposable database so those operations
            # cannot collide with another module's schema or foreign keys.
            BOOKING_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_booking_test
            CLINIC_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_clinic_test
            CLINIC_REGISTRATION_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_clinic_registration_test
            COMMERCIAL_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_commercial_test
            ONBOARDING_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_onboarding_test
            PLATFORM_ADMINISTRATION_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_platform_administration_test
            PUBLIC_BOOKING_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_public_booking_test
            RELEASE_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_release_test
            SUBSCRIPTION_BILLING_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_subscription_billing_test
            TENANT_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_tenant_test
            WEBSITE_POSTGRES_TEST_DSN: pgsql://syifa:syifa_ci_password@127.0.0.1:5432/syifa_website_test

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: pgsql, redis, mbstring, bcmath
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi

            - name: Create isolated integration databases
              env:
                  PGPASSWORD: syifa_ci_password
              run: |
                  for database in \
                      syifa_booking_test \
                      syifa_clinic_test \
                      syifa_clinic_registration_test \
                      syifa_commercial_test \
                      syifa_onboarding_test \
                      syifa_platform_administration_test \
                      syifa_public_booking_test \
                      syifa_release_test \
                      syifa_subscription_billing_test \
                      syifa_tenant_test \
                      syifa_website_test
                  do
                      createdb --host=127.0.0.1 --port=5432 --username=syifa "$database"
                  done

            - name: Run migrations against the CI database
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: syifa
                  DB_USERNAME: syifa
                  DB_PASSWORD: syifa_ci_password
              run: php artisan migrate --force

            - name: Pint (formatting)
              run: vendor/bin/pint --test

            - name: PHPStan / Larastan (level 8)
              run: composer analyse

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: npm

            - name: Build frontend assets for server-rendered feature tests
              run: |
                  npm ci
                  npx vite build --mode production

            - name: PHPUnit (Unit, Feature, Integration, Contract, Architecture)
              shell: bash
              run: |
                  set +e
                  vendor/bin/phpunit 2>&1 | tee /tmp/phpunit-output.log
                  phpunit_status=${PIPESTATUS[0]}
                  set -e

                  if [ "$phpunit_status" -ne 0 ]; then
                      failure_details=$(tail -n 100 /tmp/phpunit-output.log)
                      failure_details=${failure_details//'%'/'%25'}
                      failure_details=${failure_details//$'\r'/'%0D'}
                      failure_details=${failure_details//$'\n'/'%0A'}
                      echo "::error title=PHPUnit failure details::$failure_details"
                  fi

                  exit "$phpunit_status"

    frontend:
        name: Frontend (ESLint, Prettier, build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: ESLint
              run: npx eslint resources/js --ext .vue,.js

            - name: Prettier (check only)
              run: npx prettier --check .

            - name: Vite build
              run: npx vite build --mode production

    release-gate:
        name: Production release gate
        needs: [backend, frontend]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            deploy_enabled: ${{ steps.freeze.outputs.deploy_enabled }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - id: freeze
              name: Enforce release freeze
              run: |
                  set -euo pipefail
                  if test -f .github/RELEASE_FREEZE.md; then
                      echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
                      echo "## Production release is frozen" >> "$GITHUB_STEP_SUMMARY"
                      cat .github/RELEASE_FREEZE.md >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
                  fi

    deploy:
        name: Deploy to syifa.my
        needs: [backend, frontend, release-gate]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-gate.outputs.deploy_enabled == 'true'
        runs-on: [self-hosted, syifa]
        timeout-minutes: 20
        environment: production
        concurrency:
            group: syifa-production
            cancel-in-progress: false

        steps:
            - name: Preflight production runner
              run: |
                  set -euo pipefail
                  test -d /var/www/syifa/.git
                  test -e /usr/local/bin/syifa-deploy
                  sudo -n -l | grep -Fq '/usr/local/bin/syifa-deploy'
                  test -x /usr/bin/php8.5
                  command -v curl >/dev/null
                  command -v jq >/dev/null
                  test "$(git -c safe.directory=/var/www/syifa -C /var/www/syifa rev-parse --is-inside-work-tree)" = "true"

            - name: Deploy tested commit
              env:
                  SYIFA_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  EXPECTED_COMMIT: ${{ github.sha }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  test -n "$SYIFA_GIT_TOKEN"
                  remote_commit=$(printf 'header = "Authorization: Bearer %s"\n' "$SYIFA_GIT_TOKEN" | \
                      curl --fail --silent --show-error --config - \
                      --header 'Accept: application/vnd.github+json' \
                      "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/main" | \
                      jq --raw-output '.object.sha')
                  test "$remote_commit" = "$EXPECTED_COMMIT"
                  sudo --preserve-env=SYIFA_GIT_TOKEN,EXPECTED_COMMIT /usr/local/bin/syifa-deploy

            - name: Verify deployed commit
              env:
                  EXPECTED_COMMIT: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  deployed_commit=$(git -c safe.directory=/var/www/syifa \
                      -C /var/www/syifa rev-parse HEAD)
                  test "$deployed_commit" = "$EXPECTED_COMMIT"

            - name: Verify production health
              run: |
                  set -euo pipefail
                  curl --fail --silent --show-error \
                      --retry 5 --retry-all-errors --retry-delay 2 \
                      --max-time 15 https://syifa.my/operations/health >/dev/null
                  curl --fail --silent --show-error \
                      --retry 5 --retry-all-errors --retry-delay 2 \
                      --max-time 15 https://syifa.my/ >/dev/null

            - name: Verify official production catalogue
              run: |
                  set -euo pipefail
                  /usr/bin/php8.5 /var/www/syifa/scripts/verify-production-catalogue.php https://syifa.my
