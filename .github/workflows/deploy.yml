name: Deploy

# Every push to main deploys, regardless of CI. The runner lives on the
# production host itself and dials out to GitHub, so no inbound SSH access or
# runner IP allowlist is involved.
on:
    push:
        branches: [main]
    workflow_dispatch:

# Never run two deploys at once: syifa-deploy runs migrations and rewrites the
# app directory. Queue instead of cancelling, so a deploy is not killed
# part-way through a migration.
concurrency:
    group: syifa-deploy
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy to syifa.my
        runs-on: [self-hosted, syifa]
        timeout-minutes: 20

        steps:
            # No checkout: syifa-deploy does its own fetch and reset of
            # /var/www/syifa, and reloads FPM afterwards. Checking out here
            # would only duplicate the tree the runner never uses.
            #
            # The repo is private, so the deploy cannot fetch anonymously.
            # This job token is scoped to this repo and expires with the job,
            # which is why no long-lived credential sits on the server.
            - name: Run syifa-deploy
              env:
                  SYIFA_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  test -n "$SYIFA_GIT_TOKEN"
                  sudo --preserve-env=SYIFA_GIT_TOKEN /usr/local/bin/syifa-deploy

            # Never report a green deployment when the server is still
            # serving an older checkout. This catches stale fetches, failed
            # resets and deployments that targeted the wrong directory.
            - name: Verify deployed commit
              env:
                  EXPECTED_COMMIT: ${{ github.sha }}
              run: |
                  # No sudo: the runner user may only run syifa-deploy, so
                  # `sudo git` prompts for a password and fails the job even
                  # though the deploy itself succeeded. safe.directory is what
                  # git actually needs here -- the checkout is www-data's.
                  deployed_commit=$(git -c safe.directory=/var/www/syifa \
                      -C /var/www/syifa rev-parse HEAD)
                  test "$deployed_commit" = "$EXPECTED_COMMIT"

            # The governed catalogue is synchronized by the deployment
            # migration. Verify the client-visible contract after FPM has been
            # reloaded: homepage and registration must expose identical IDs,
            # currency and authoritative prices.
            - name: Verify official production catalogue
              run: |
                  # Pin the binary: the runner user's default `php` is 8.3,
                  # while this app runs on 8.5. Harmless for this standalone
                  # script today, but every cron and service on this shared box
                  # names an absolute binary rather than trusting the default.
                  /usr/bin/php8.5 /var/www/syifa/scripts/verify-production-catalogue.php https://syifa.my
