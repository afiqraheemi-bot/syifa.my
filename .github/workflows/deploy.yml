name: Deploy

# Every push to main deploys, regardless of CI. The runner lives on the
# production host itself and dials out to GitHub, so no inbound SSH access or
# runner IP allowlist is involved.
on:
    push:
        branches: [main]
    workflow_dispatch:

# Never run two deploys at once: syifa-deploy runs migrations and rewrites the
# app directory. Queue instead of cancelling, so a deploy is not killed
# part-way through a migration.
concurrency:
    group: syifa-deploy
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy to syifa.my
        runs-on: [self-hosted, syifa]
        timeout-minutes: 20

        steps:
            # No checkout: syifa-deploy does its own fetch and reset of
            # /var/www/syifa, and reloads FPM afterwards. Checking out here
            # would only duplicate the tree the runner never uses.
            #
            # The repo is private, so the deploy cannot fetch anonymously.
            # This job token is scoped to this repo and expires with the job,
            # which is why no long-lived credential sits on the server.
            - name: Run syifa-deploy
              env:
                  SYIFA_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  test -n "$SYIFA_GIT_TOKEN"
                  sudo --preserve-env=SYIFA_GIT_TOKEN /usr/local/bin/syifa-deploy

            # Catalogue data is governed application state rather than demo
            # content. Keep the production offers in sync after migrations so
            # the public pricing page and registration flow cannot deploy with
            # an empty or stale official catalogue.
            - name: Synchronize and verify official catalogue
              run: |
                  sudo -u www-data -- php /var/www/syifa/artisan syifa:catalogue:sync --force
